if(!db.days[new Date().toISOString().slice(0,10)]) db.days[new Date().toISOString().slice(0,10)]={checks:db.checks||{},water:db.water||0,liters:db.liters||'',sleepStart:db.sleepStart||'',sleepEnd:db.sleepEnd||'',steps:db.steps||0,validated:false,note:'',fastFood:null,sweets:null};
let page='home';
let selectedDate=new Date().toISOString().slice(0,10);
if(!db.days) db.days={};
function dayData(d){ if(!db.days[d]) db.days[d]={checks:{},water:0,liters:'',sleepStart:'',sleepEnd:'',steps:0,validated:false,note:'',fastFood:null,sweets:null}; return db.days[d]; }
const todayKey=()=>new Date().toISOString().slice(0,10);
function setSelectedDate(d){selectedDate=d;render();}
function save(){localStorage.setItem('routineDB',JSON.stringify(db))}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function nav(){document.getElementById('nav').innerHTML=navItems.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(p){page=p;nav();render()}
function render(){const titles={home:['Accueil','Ton tableau de bord futuriste.'],sport:['Sport','Ajoute et modifie tes séances.'],day:['Ma journée','Modifie la journée sélectionnée puis valide-la quand elle est complète.'],food:['Alimentation','Ajoute et modifie les données de tes repas.'],profile:['Données personnelles','Informations modifiables à tout moment.'],report:['Bilan','Vue semaine, mois et année de tes activités.'],goals:['Objectifs','Des objectifs mesurables et adaptables.'],plan:['Planning','Organise tes cours, révisions, sport, pauses et événements.'],calendar:['Calendrier','Une vue globale et claire de tous tes jours.'],recap:['Récapitulatif','Un journal modifiable de ce que tu as fait.']};document.getElementById('title').textContent=titles[page][0];document.getElementById('subtitle').textContent=titles[page][1];document.getElementById('content').innerHTML=views[page]();}
const views={
home:()=>{const forgotten=suggestions.filter(s=>db.checks[s]===false).slice(0,8);return `<div class="dashboard-grid"><div class="dash-card dash-purple" onclick="go('sport')"><div class="dash-icon">🏋️</div><h3>Sport</h3><p>Musculation, sports, course & marche</p></div><div class="dash-card dash-blue" onclick="go('day')"><div class="dash-icon">☀️</div><h3>Ma journée</h3><p>Habitudes, sommeil, eau et suivi du jour</p></div><div class="dash-card dash-green" onclick="go('food')"><div class="dash-icon">🍴</div><h3>Alimentation</h3><p>Repas, quantités et photos</p></div><div class="dash-card dash-orange" onclick="go('goals')"><div class="dash-icon">🎯</div><h3>Objectifs</h3><p>Définis et suis tes objectifs</p></div><div class="dash-card dash-cyan" onclick="go('calendar')"><div class="dash-icon">🗓️</div><h3>Calendrier</h3><p>Vue globale et modification des jours</p></div><div class="dash-card dash-pink" onclick="go('profile')"><div class="dash-icon">👤</div><h3>Données personnelles</h3><p>Informations modifiables à tout moment</p></div><div class="dash-card dash-yellow" onclick="go('report')"><div class="dash-icon">📊</div><h3>Bilan</h3><p>Statistiques de tes activités</p></div><div class="dash-card dash-indigo" onclick="go('plan')"><div class="dash-icon">📋</div><h3>Planning</h3><p>Cours, révisions, sport et événements</p></div><div class="dash-card dash-red" onclick="go('recap')"><div class="dash-icon">📝</div><h3>Récapitulatif</h3><p>Garde une trace de ce que tu as fait</p></div><div class="card dashboard-wide forgotten-card"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0 0 4px">🔔 À ne pas oublier</h3><div class="muted">Les journées ou tâches oubliées restent visibles ici.</div></div><div class="pill">${forgotten.length?forgotten.length+' oubli(s)':'Tout est à jour'}</div></div>${forgotten.length?`<div class="checklist" style="margin-top:12px">${forgotten.map(s=>`<label class="check"><input type="checkbox" onchange="rememberCheck('${esc(s)}',this.checked)"><span>${s}</span></label>`).join('')}</div>`:`<div class="empty">Aucun oubli enregistré. 👍</div>`}</div><div class="card dashboard-wide" style="background:rgba(255,255,255,.7)"><div class="row" style="justify-content:space-between"><div><b>Repères du jour</b><div class="muted">${db.steps||0} pas · ${db.water||0} verres</div></div><button class="btn" onclick="go('day')">Ouvrir ma journée</button></div></div></div>`},
sport:()=>`<div class="grid"><div class="span12 card"><h3>Trois espaces</h3><div class="row"><button class="btn" onclick="sportTab='muscu';renderSport()">Musculation</button><button class="btn alt" onclick="sportTab='sports';renderSport()">Sports</button><button class="btn alt" onclick="sportTab='run';renderSport()">Course & marche</button></div></div><div class="span12 card" id="sportArea"></div></div>`,
day:()=>{const d=dayData(selectedDate);const today=todayKey();const done=suggestions.filter(x=>d.checks[x]===true).length;const missed=suggestions.filter(x=>d.checks[x]===false).length;return `<div class="grid"><div class="span12 card"><div class="row" style="justify-content:space-between"><div><h3>Ma journée</h3><div class="muted">Choisis une date, modifie les informations, puis valide la journée quand tu veux.</div></div><div class="row"><input class="input" type="date" value="${selectedDate}" onchange="setSelectedDate(this.value)"><span class="pill">${d.validated?'✓ Journée validée':'○ Non validée'}</span></div></div></div><div class="span4 card"><h3>💧 Hydratation</h3><div class="stat">${d.water||0}</div><div class="muted">verres</div><div class="row" style="margin-top:10px"><button class="btn" onclick="d.water=(d.water||0)+1;save();render()">+ 1</button><button class="btn alt" onclick="d.water=Math.max(0,(d.water||0)-1);save();render()">−</button></div><input class="input" style="margin-top:8px" type="number" step="0.1" placeholder="Litres" value="${d.liters||''}" onchange="d.liters=this.value;save()"></div><div class="span4 card"><h3>🌙 Sommeil</h3><div class="formgrid"><label>Coucher<input class="input" type="time" value="${d.sleepStart}" onchange="d.sleepStart=this.value;save();render()"></label><label>Réveil<input class="input" type="time" value="${d.sleepEnd}" onchange="d.sleepEnd=this.value;save();render()"></label></div><p><b>${sleepHours(d)}</b></p></div><div class="span4 card"><h3>👟 Pas</h3><input class="input" type="number" min="0" value="${d.steps||0}" onchange="d.steps=Number(this.value)||0;save();render()"></div><div class="span6 card"><h3>🍔 Fast-food</h3><div class="row"><button class="btn ${d.fastFood===true?'':'alt'}" onclick="d.fastFood=true;save();render()">Oui</button><button class="btn ${d.fastFood===false?'':'alt'}" onclick="d.fastFood=false;save();render()">Non</button></div><p class="muted">Le choix est enregistré pour cette date.</p></div><div class="span6 card"><h3>🍬 Sucrerie</h3><div class="row"><button class="btn ${d.sweets===true?'':'alt'}" onclick="d.sweets=true;save();render()">Oui</button><button class="btn ${d.sweets===false?'':'alt'}" onclick="d.sweets=false;save();render()">Non</button></div><p class="muted">Le choix est enregistré pour cette date.</p></div><div class="span12 card"><h3>✅ Checklist du quotidien <span class="pill">${done}/${suggestions.length}</span></h3><div class="row"><input class="input" id="filter" placeholder="Rechercher parmi les suggestions..." oninput="filterChecks(this.value)"><button class="btn alt" onclick="randomSuggestion()">Suggestion</button></div><div id="checklist" class="checklist" style="margin-top:10px"></div></div><div class="span12 card"><h3>📝 Note de la journée</h3><textarea class="input" rows="4" placeholder="Ce que tu veux retenir de cette journée..." onchange="d.note=this.value;save()">${d.note||''}</textarea></div><div class="span12 card"><div class="row" style="justify-content:space-between"><div><h3>Valider ma journée</h3><div class="muted">Les données restent enregistrées même avant validation. La validation sert simplement à marquer cette journée comme terminée.</div></div><button class="btn" onclick="d.validated=true;save();toast('Journée validée ✓');render()">${d.validated?'Journée validée ✓':'Valider ma journée'}</button></div></div></div>`},
food:()=>`<div class="grid"><div class="span6 card"><h3>Ajouter un repas</h3><div class="formgrid"><label>Aliment<input id="foodName" class="input" placeholder="Ex. pâtes"></label><label>Quantité (g)<input id="foodQty" class="input" type="number"></label><label>Photo<input id="foodPhoto" class="input" type="file" accept="image/*"></label></div><p class="muted">Les informations nutritionnelles sont indicatives. Pas d'objectif de restriction ou de perte de poids.</p><button class="btn" onclick="addFood()">Ajouter</button></div><div class="span6 card"><h3>Journal</h3>${db.food.length?`<table class="table"><tr><th>Aliment</th><th>Qté</th></tr>${db.food.slice(-12).reverse().map(f=>`<tr><td>${f.photo?`<img src="${f.photo}" style="width:46px;height:46px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:7px">`:''}${f.name}</td><td>${f.qty||'-'} g</td></tr>`).join('')}</table>`:'<div class="empty">Aucun repas enregistré.</div>'}</div><div class="span12 card"><h3>Idées rapides</h3><div class="row">${['Pâtes','Riz','Œufs','Légumes','Fruits','Yaourt','Pain','Légumineuses','Poisson','Poulet'].map(x=>`<span class="pill">${x}</span>`).join(' ')}</div></div></div>`,
profile:()=>`<div class="grid"><div class="span8 card"><h3>Mes données</h3><div class="formgrid"><label>Âge<input class="input" type="number" value="${db.profile.age}" onchange="db.profile.age=this.value;save()"></label><label>Taille (cm)<input class="input" type="number" value="${db.profile.height}" onchange="db.profile.height=this.value;save()"></label><label>Poids (kg)<input class="input" type="number" step="0.1" value="${db.profile.weight}" onchange="db.profile.weight=this.value;save()"></label><label>Note personnelle<input class="input" value="${db.profile.note||''}" onchange="db.profile.note=this.value;save()"></label></div><p class="muted">Ces données restent sur cet appareil dans cette version. Elles sont modifiables ou supprimables.</p></div><div class="span4 card"><h3>Énergie d'activité</h3><p>Tu peux enregistrer la durée et l'intensité d'une activité dans Sport. Les estimations d'énergie sont approximatives et ne servent pas de cible alimentaire.</p></div></div>`,
report:()=>{let w=db.workouts.length,a=db.activities.length;return `<div class="grid"><div class="span3 card"><div class="stat">${w}</div><div class="muted">séances muscu</div></div><div class="span3 card"><div class="stat">${a}</div><div class="muted">activités sportives</div></div><div class="span3 card"><div class="stat">${db.goals.length}</div><div class="muted">objectifs</div></div><div class="span3 card"><div class="stat">${db.events.length}</div><div class="muted">éléments planning</div></div><div class="span8 card"><h3>Semaine / mois / année</h3><p class="muted">Le bilan s'enrichit automatiquement à partir des données que tu enregistres.</p><table class="table"><tr><th>Période</th><th>À suivre</th></tr><tr><td>Semaine</td><td>séances, temps d'activité, révisions, tâches terminées</td></tr><tr><td>Mois</td><td>sport le plus pratiqué, nombre de séances, objectifs</td></tr><tr><td>Année</td><td>tendances, grands objectifs, total d'activités</td></tr></table></div><div class="span4 card"><h3>Sport le plus pratiqué</h3><div class="stat">${mostSport()}</div></div></div>`},
goals:()=>`<div class="grid"><div class="span6 card"><h3>Créer un objectif</h3><input id="goalName" class="input" placeholder="Ex. Réviser 5 fois avant le contrôle"><div class="formgrid" style="margin-top:10px"><label>Mesure<input id="goalMeasure" class="input" placeholder="sessions, minutes..."></label><label>Cible<input id="goalTarget" class="input" type="number"></label><label>Période<select id="goalPeriod" class="select"><option>Cette semaine</option><option>Ce mois</option><option>Cette année</option></select></label><label>Progression<input id="goalProgress" class="input" type="number" value="0"></label></div><button class="btn" style="margin-top:10px" onclick="addGoal()">Ajouter</button></div><div class="span6 card"><h3>Mes objectifs</h3>${db.goals.length?db.goals.map((g,i)=>`<div style="margin-bottom:14px"><b>${g.name}</b><div class="muted">${g.measure||'mesure'} · ${g.period}</div><div class="progress"><i style="width:${Math.min(100,100*g.progress/(g.target||1))}%"></i></div><div class="row"><small>${g.progress}/${g.target}</small><button class="btn alt" onclick="db.goals.splice(${i},1);save();render()">Supprimer</button></div></div>`).join(''):'<div class="empty">Aucun objectif.</div>'}</div></div>`,
calendar:()=>{const base=new Date(selectedDate+'T12:00:00');const y=base.getFullYear(),m=base.getMonth();const first=new Date(y,m,1).getDay();const offset=(first+6)%7;const days=new Date(y,m+1,0).getDate();const names=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];let cells=names.map(n=>`<div class="calhead">${n}</div>`).join('');for(let i=0;i<offset;i++)cells+=`<div class="calcell empty"></div>`;for(let n=1;n<=days;n++){const key=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;const dd=dayData(key);const ev=db.events.filter(e=>e.date===key).length;const act=db.activities.filter(a=>a.date&&a.date.slice(0,10)===key).length;const validated=dd.validated;cells+=`<button class="calcell ${key===selectedDate?'selected':''} ${validated?'validated':''}" onclick="setSelectedDate('${key}');go('day')"><b>${n}</b><span>${validated?'✓ ':''}${ev?'📅 '+ev+' ':''}${act?'🏃 '+act:''}</span></button>`}return `<div class="grid"><div class="span12 card"><div class="row" style="justify-content:space-between"><div><h3>🗓️ Calendrier global</h3><p class="muted">Clique directement sur un jour pour le modifier.</p></div><div class="row"><button class="btn alt" onclick="calendarShift(-1)">‹</button><input class="input" type="month" value="${y}-${String(m+1).padStart(2,'0')}" onchange="calendarMonth(this.value)"><button class="btn alt" onclick="calendarShift(1)">›</button></div></div><div class="calendar">${cells}</div><div class="row" style="margin-top:12px"><span class="pill">✓ journée validée</span><span class="pill">📅 événement</span><span class="pill">🏃 activité</span></div></div><div class="span12 card"><h3>Ouvrir une date</h3><div class="row"><input class="input" type="date" value="${selectedDate}" onchange="setSelectedDate(this.value)"><button class="btn" onclick="go('day')">Modifier cette journée</button></div></div></div>`},
recap:()=>{const entries=Object.entries(db.days||{}).filter(([k,v])=>v.note||v.validated).sort((a,b)=>b[0].localeCompare(a[0]));return `<div class="grid"><div class="span12 card"><h3>📝 Mon récapitulatif</h3><p class="muted">Tu peux modifier le récapitulatif directement depuis « Ma journée » en choisissant la date.</p><button class="btn" onclick="go('day')">Modifier ${selectedDate}</button></div><div class="span12 card"><h3>Historique</h3>${entries.length?entries.map(([d,v])=>`<div class="check" style="margin-bottom:8px"><div style="flex:1"><b>${d}</b> ${v.validated?'✓':''}<p style="margin:5px 0">${v.note||'Journée validée sans note.'}</p></div><button class="btn alt" onclick="setSelectedDate('${d}');go('day')">Modifier</button></div>`).join(''):'<div class="empty">Aucun récapitulatif enregistré.</div>'}</div></div>`},
plan:()=>`<div class="grid"><div class="span5 card"><h3>Ajouter au planning</h3><input id="eventName" class="input" placeholder="Ex. Réviser sciences"><div class="formgrid" style="margin-top:10px"><label>Date<input id="eventDate" class="input" type="date"></label><label>Heure<input id="eventTime" class="input" type="time"></label><label>Durée (min)<input id="eventDur" class="input" type="number" min="1" max="1440" value="45"></label><label>Répétition<select id="eventRep" class="select"><option>Une fois</option><option>Tous les jours</option><option>Toutes les semaines</option></select></label></div><p class="muted">Pour une révision répétée, indique le nombre de séances souhaitées dans l'objectif : le planning peut ensuite être ajusté manuellement.</p><button class="btn" onclick="addEvent()">Planifier</button></div><div class="span7 card"><h3>Planning</h3>${db.events.length?`<table class="table"><tr><th>Date</th><th>Heure</th><th>Durée</th><th>Tâche</th><th></th></tr>${db.events.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map((e,i)=>`<tr><td>${e.date||'-'}</td><td>${e.time||'-'}</td><td>${e.dur} min</td><td>${e.name}<br><small class="muted">${e.rep}</small></td><td><button class="btn alt" onclick="db.events.splice(${i},1);save();render()">×</button></td></tr>`).join('')}</table>`:'<div class="empty">Ton planning est vide.</div>'}</div></div>`
};
let sportTab='muscu';function renderSport(){const a=document.getElementById('sportArea');if(!a)return;if(sportTab==='muscu')a.innerHTML=`<h3>Musculation</h3><input class="input" placeholder="Rechercher un exercice..." oninput="filterExercises(this.value)"><div id="exGrid" class="exercise-grid" style="margin-top:12px"></div><div class="notice" style="margin-top:14px">Repère : <b>0 kg = poids du corps</b>. Choisis une charge adaptée et privilégie une technique contrôlée.</div>`;else if(sportTab==='sports')a.innerHTML=`<h3>Sports</h3><input class="input" placeholder="Rechercher un sport..." oninput="filterSports(this.value)"><div id="spGrid" class="sport-grid" style="margin-top:12px"></div>`;else a.innerHTML=`<h3>Course & marche</h3><div class="formgrid"><label>Distance (km)<input id="runDist" class="input" type="number" step="0.01"></label><label>Temps (min)<input id="runTime" class="input" type="number" step="1"></label><label>Pas<input id="runSteps" class="input" type="number"></label><label>Type<select id="runType" class="select"><option>Course</option><option>Marche</option></select></label></div><button class="btn" style="margin-top:10px" onclick="addRun()">Enregistrer</button><p>Allure calculée : <b id="pace">—</b> min/km</p>`;if(sportTab==='muscu')filterExercises('');if(sportTab==='sports')filterSports('')}
function filterExercises(q){const g=document.getElementById('exGrid');if(!g)return;g.innerHTML=exercises.filter(e=>(e[0]+' '+e[1]).toLowerCase().includes(q.toLowerCase())).map((e,i)=>`<div class="exercise" onclick="openExercise(${i})"><div class="icon">${e[3]}</div><h4>${e[0]}</h4><small>${e[1]}</small><p>${e[2]}</p></div>`).join('')}
function filterSports(q){const g=document.getElementById('spGrid');if(!g)return;g.innerHTML=sports.filter(e=>(e[0]+' '+e[2]).toLowerCase().includes(q.toLowerCase())).map((e,i)=>`<div class="sport" onclick="openSport(${i})"><div class="icon">${e[1]}</div><h4>${e[0]}</h4><small>${e[2]}</small></div>`).join('')}
function openExercise(i){const e=exercises[i];document.getElementById('modalbox').innerHTML=`<h2>${e[3]} ${e[0]}</h2><p>${e[2]}</p><div class="formgrid"><label>Séries<input id="ws" class="input" type="number" min="0"></label><label>Répétitions<input id="wr" class="input" type="number" min="0"></label><label>Poids (kg)<input id="ww" class="input" type="number" min="0" step="0.5" value="0"></label><label>Note<input id="wn" class="input"></label></div><p class="muted">0 kg = poids du corps.</p><button class="btn" onclick="saveWorkout('${e[0]}')">Enregistrer</button> <button class="btn alt" onclick="closeModal()">Fermer</button>`;openModal()}
function openSport(i){const s=sports[i];document.getElementById('modalbox').innerHTML=`<h2>${s[1]} ${s[0]}</h2><p>Indicateurs suggérés : ${s[2]}.</p><div class="formgrid"><label>Durée (min)<input id="ad" class="input" type="number"></label><label>Résultat / score<input id="as" class="input"></label><label>Indicateur 1<input id="a1" class="input"></label><label>Indicateur 2<input id="a2" class="input"></label></div><button class="btn" onclick="saveActivity('${s[0]}')">Enregistrer</button> <button class="btn alt" onclick="closeModal()">Fermer</button>`;openModal()}
function saveWorkout(name){db.workouts.push({name,date:new Date().toISOString(),sets:+ws.value||0,reps:+wr.value||0,weight:+ww.value||0,note:wn.value});save();closeModal();toast('Séance enregistrée');render()}
function saveActivity(name){db.activities.push({name,date:new Date().toISOString(),duration:+ad.value||0,score:as.value,i1:a1.value,i2:a2.value});save();closeModal();toast('Activité enregistrée');render()}
function addRun(){let d=+runDist.value||0,t=+runTime.value||0;if(!d||!t){toast('Renseigne distance et temps');return}db.activities.push({name:runType.value,date:new Date().toISOString(),duration:t,distance:d,steps:+runSteps.value||0});save();toast('Sortie enregistrée');render();}
function addFood(){const n=foodName.value.trim();if(!n)return;const file=foodPhoto.files&&foodPhoto.files[0];const finish=(photo='')=>{db.food.push({name:n,qty:+foodQty.value||0,photo});save();toast('Repas ajouté');render()};if(file){const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file)}else finish()}
function addGoal(){const n=goalName.value.trim();if(!n)return;db.goals.push({name:n,measure:goalMeasure.value,target:+goalTarget.value||1,period:goalPeriod.value,progress:+goalProgress.value||0});save();render()}
function addEvent(){const n=eventName.value.trim();if(!n)return;db.events.push({name:n,date:eventDate.value,time:eventTime.value,dur:Math.min(1440,Math.max(1,+eventDur.value||1)),rep:eventRep.value});save();toast('Ajouté au planning');render()}
function sleepHours(d=dayData(selectedDate)){if(!d.sleepStart||!d.sleepEnd)return '—';let [h1,m1]=d.sleepStart.split(':').map(Number),[h2,m2]=d.sleepEnd.split(':').map(Number);let a=h1*60+m1,b=h2*60+m2;if(b<=a)b+=1440;let mins=b-a;return `${Math.floor(mins/60)} h ${String(mins%60).padStart(2,'0')}`}
function rememberCheck(s,v){dayData(selectedDate).checks[s]=v;save();toast(v?'Marqué comme fait':'Rappel conservé')}
function filterChecks(q){const d=dayData(selectedDate);const arr=suggestions.filter(s=>s.toLowerCase().includes(q.toLowerCase()));document.getElementById('checklist').innerHTML=arr.map(s=>`<label class="check"><input type="checkbox" ${d.checks[s]?'checked':''} onchange="rememberCheck('${esc(s)}',this.checked)"><span>${s}</span></label>`).join('')}
function calendarMonth(v){if(v){const [y,m]=v.split('-');selectedDate=`${y}-${m}-01`;render()}}
function calendarShift(delta){const d=new Date(selectedDate+'T12:00:00');d.setMonth(d.getMonth()+delta);selectedDate=d.toISOString().slice(0,10);render()}
function randomSuggestion(){const s=suggestions[Math.floor(Math.random()*suggestions.length)];toast('Suggestion : '+s)}
