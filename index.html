<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#eef8ff"><title>Routine</title>
<style>
:root{--b:#238cff;--c:#29c7ef;--ink:#17324a;--muted:#607486;--card:rgba(255,255,255,.9);--line:#cfe5f5;--shadow:0 10px 30px rgba(35,110,155,.14)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}body{background:linear-gradient(rgba(250,254,255,.56),rgba(238,249,255,.72)),url('arrière-plan.png') center/cover fixed no-repeat}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{width:min(760px,100%);margin:auto;padding:12px 11px 35px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 3px 12px}.brand{font-size:25px;font-weight:900}.sub,.muted{color:var(--muted);font-size:14px}.icon,.back,.btn{border-radius:15px;padding:11px 14px;font-weight:850}.icon,.back{background:rgba(255,255,255,.92);border:1px solid var(--line);color:var(--ink)}.btn{border:0;background:linear-gradient(135deg,var(--b),#62c8ff);color:#fff;box-shadow:0 7px 18px #238cff2d}.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}h1{font-size:30px;margin:0 0 3px}h2{font-size:23px;margin:0 0 8px}h3{font-size:17px;margin:0 0 4px}p{font-size:16px;line-height:1.45}.card{background:var(--card);border:1px solid #fff;border-radius:23px;padding:17px;margin:11px 0;box-shadow:var(--shadow);backdrop-filter:blur(10px)}.home{display:flex;flex-direction:column;gap:12px}.homeCard{width:100%;min-height:112px;display:flex;align-items:center;text-align:left;gap:15px;padding:16px;border:1px solid #fff;border-radius:24px;background:rgba(255,255,255,.93);box-shadow:var(--shadow);color:var(--ink)}.homeCard:active{transform:scale(.985)}.homeIcon{width:57px;height:57px;flex:none;border-radius:18px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,#e6f4ff,#e8fcff);border:1px solid #cceaff}.homeCard strong{display:block;font-size:20px}.homeCard small{display:block;color:var(--muted);font-size:14px;margin-top:2px}.notice{background:#fff9df;border:1px solid #efd68a;border-radius:16px;padding:13px;margin:10px 0}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.field{margin:8px 0}.field label{display:block;font-size:14px;font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);outline:none}textarea{min-height:130px}.tabs{display:flex;flex-direction:column;gap:8px}.tab{padding:13px;text-align:left;border:1px solid var(--line);border-radius:16px;background:#fff;font-weight:850;color:var(--ink)}.tab.active{border-color:#69baff;background:#eaf7ff}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.exercise,.sportItem,.list{background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:18px;padding:12px;margin:9px 0}.exTop{display:flex;gap:11px;align-items:center}.stick{width:100px;height:73px;flex:none;display:grid;place-items:center;background:#eef9ff;border:1px solid #c8eaff;border-radius:14px}.stick svg{width:94px;height:64px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.metrics .field{margin:8px 0 0}.check{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:15px;padding:9px 11px;margin:7px 0}.mini{padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800}.yes.on{background:#dff9e9;color:#167747}.no.on{background:#ffe7e7;color:#b52f2f}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:rgba(255,255,255,.84);border:1px solid var(--line);border-radius:17px;padding:13px}.stat b{display:block;font-size:25px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.dow{text-align:center;font-size:12px;font-weight:900;color:var(--muted);padding:4px}.day{min-height:44px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:800;position:relative}.day.empty{visibility:hidden}.day.today{outline:2px solid #66b8ff}.day.sel{background:#e5f5ff;border-color:#5db1ff}.dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#23b66d;bottom:5px;left:50%;transform:translateX(-50%)}.actions{display:flex;gap:5px;flex-wrap:wrap}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
@media(max-width:520px){.shell{padding:10px 9px 28px}h1{font-size:28px}.homeCard{min-height:106px}.homeIcon{width:53px;height:53px}.metrics{grid-template-columns:1fr 1fr}.exTop{align-items:flex-start}.stick{width:91px}}
</style></head>
<body><main class="shell"><header class="top"><div><div class="brand">Routine ✦</div><div class="sub">Sport · organisation · études</div></div><button class="icon" onclick="exportData()">⇩</button></header><div id="app"></div><div class="footer">Les données restent dans le navigateur de cet appareil.</div></main>
<script>
const DEFAULT=["Boire un verre d'eau au réveil","Faire son lit","Aérer la chambre","Se laver les dents le matin","Préparer ses affaires","Vérifier son sac","Regarder le planning du jour","Ranger le bureau","Faire une pause écran","Marcher quelques minutes","Faire une vraie pause déjeuner","Ranger après avoir mangé","Lire quelques pages","Faire une activité créative","Préparer les affaires du lendemain","Se laver les dents le soir","Préparer une tenue pour demain","Noter l'heure du coucher","Noter l'heure du réveil","Noter les pas"];
const EXTRA=["Prendre une douche","Mettre les vêtements au panier","Ranger les chaussures","Nettoyer le bureau","Préparer la gourde","Remplir la gourde","Vérifier les devoirs","Vérifier les contrôles","Préparer le matériel de sport","Préparer le matériel scolaire","Faire une courte pause","Ranger le téléphone","Faire une promenade","Prendre l'air","Ouvrir les volets","Fermer les volets","Ranger les livres","Classer les documents","Préparer la trousse","Vérifier les clés","Préparer le goûter","Ranger la cuisine","Mettre la table","Débarrasser la table","Faire la vaisselle","Sortir les déchets","Ranger le sac de sport","Vérifier les chaussures","Préparer une playlist","Écrire les priorités","Faire le point sur la journée","Noter une idée","Noter une tâche importante","Planifier une pause","Planifier une séance","Planifier une révision","Réviser 15 minutes","Réviser 30 minutes","Relire une leçon","Faire une fiche","Faire des exercices","Corriger ses exercices","Préparer une question pour le cours","Lire le cours du lendemain","Trier les photos","Ranger les fichiers","Vérifier les téléchargements","Répondre aux messages importants","Préparer le réveil","Vérifier l'heure du réveil","Éloigner le téléphone du lit","Baisser la luminosité","Mode silencieux","Préparer un moment calme","Étirements doux","Respirer quelques minutes","Activité sans écran","Jouer d'un instrument","Dessiner","Écrire","Faire une photo","Faire du bricolage","Faire un puzzle","Ranger une étagère","Ranger un tiroir","Nettoyer l'écran","Nettoyer le clavier","Organiser le bureau","Préparer une liste de courses","Vérifier les rendez-vous","Vérifier le calendrier","Ajouter un événement","Supprimer une tâche terminée","Choisir la tenue du lendemain","Préparer le petit-déjeuner","Préparer le repas suivant","Boire de l'eau pendant la journée","Noter un entraînement","Noter une sortie","Noter une révision","Faire le bilan de la journée","Écrire le récapitulatif de la semaine"];
const EX=[
["Pompes","Pectoraux","Corps aligné, descente contrôlée.","push"],["Squat","Jambes","Descendre avec des appuis stables.","squat"],["Fentes","Jambes","Un pas, descente verticale, retour.","lunge"],["Gainage","Tronc","Corps aligné pendant la tenue.","plank"],["Tractions","Dos","Tirer le corps vers la barre.","pull"],["Développé couché","Pectoraux","Contrôler la charge et les appuis.","bench"],["Élévations latérales","Épaules","Lever les bras de façon contrôlée.","lat"],["Soulevé de terre","Chaîne postérieure","Dos neutre et charge proche du corps.","dead"],["Hip thrust","Fessiers","Pousser le bassin vers le haut.","hip"],["Crunch","Abdominaux","Enrouler doucement le haut du corps.","crunch"]];
const SPORTS=[["Football","⚽","Buts, passes, tirs cadrés, score, durée"],["Tennis","🎾","Services, coups droits, revers, score"],["Basketball","🏀","Paniers, passes, rebonds, score"],["Natation","🏊","Distance, longueurs, durée"],["Cyclisme","🚴","Distance, durée, vitesse"],["Badminton","🏸","Points, matchs, services, durée"],["Handball","🤾","Buts, passes, tirs, durée"],["Volleyball","🏐","Services, points, réceptions"],["Rugby","🏉","Essais, passes, durée"],["Danse","💃","Durée, style, séance"],["Escalade","🧗","Voies, réussites, durée"],["Skate","🛹","Distance, durée, éléments"],["Athlétisme","🏃","Épreuve, distance, temps"],["Ping-pong","🏓","Matchs, points, services"],["Golf","⛳","Trous, score, durée"],["Randonnée","🥾","Distance, durée, dénivelé"]];
let old=JSON.parse(localStorage.getItem('routineDB')||'null')||{};
const db={...old,checks:old.checks||{},water:old.water||0,sleepStart:old.sleepStart||'',sleepEnd:old.sleepEnd||'',steps:old.steps||0,food:Array.isArray(old.food)?old.food:[],workouts:Array.isArray(old.workouts)?old.workouts:[],activities:Array.isArray(old.activities)?old.activities:[],goals:Array.isArray(old.goals)?old.goals:[],events:Array.isArray(old.events)?old.events:[],profile:old.profile||{height:'',weight:'',age:'',note:''},customChecks:Array.isArray(old.customChecks)?old.customChecks:[],activeChecks:Array.isArray(old.activeChecks)?old.activeChecks:DEFAULT.slice(),dayLogs:old.dayLogs||{},recaps:old.recaps||{},selectedDate:old.selectedDate||new Date().toISOString().slice(0,10)};
let page='home',sportTab='muscu',cursor=new Date();cursor.setDate(1);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const save=()=>localStorage.setItem('routineDB',JSON.stringify(db)); const go=p=>{page=p;render()};
const back=()=>`<button class="back" onclick="go('home')">← Accueil</button>`;
function dayData(d){return db.dayLogs[d]||{checks:{},water:0,steps:'',sleepStart:'',sleepEnd:'',validated:false}}
function setDay(k,v){let d=dayData(db.selectedDate);d[k]=v;db.dayLogs[db.selectedDate]=d;save()}
function setCheck(n,v){let d=dayData(db.selectedDate);d.checks[n]=v;db.dayLogs[db.selectedDate]=d;save();render()}
function validate(){setDay('validated',true);render()}
function sleepLen(a,b){if(!a||!b)return '—';let [h,m]=a.split(':').map(Number),[H,M]=b.split(':').map(Number),x=h*60+m,y=H*60+M;if(y<=x)y+=1440;let z=y-x;return Math.floor(z/60)+' h '+String(z%60).padStart(2,'0')}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='routine-donnees.json';a.click()}
function svg(t){let c='fill="none" stroke="#238cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"';let body={
push:`<line x1="7" y1="61" x2="113" y2="61" stroke="#68c6ff" stroke-width="3"/><circle cx="76" cy="28" r="6" ${c}/><path d="M70 34 50 47 28 51M50 47 34 61M28 51 14 61M50 47 68 58" ${c}/>` ,
squat:`<line x1="8" y1="63" x2="112" y2="63" stroke="#68c6ff" stroke-width="3"/><circle cx="61" cy="12" r="6" ${c}/><path d="M57 18 54 36 39 49 27 63M54 36 71 48 83 63M50 25 34 37M50 25 69 31" ${c}/>` ,
lunge:`<line x1="8" y1="63" x2="112" y2="63" stroke="#68c6ff" stroke-width="3"/><circle cx="55" cy="12" r="6" ${c}/><path d="M53 18 55 35 42 48 29 63M55 35 72 47 91 63M51 24 35 34M52 23 69 35" ${c}/>` ,
plank:`<line x1="8" y1="62" x2="112" y2="62" stroke="#68c6ff" stroke-width="3"/><circle cx="76" cy="27" r="6" ${c}/><path d="M70 33 50 45 29 54 15 62M50 45 44 62" ${c}/>` ,
pull:`<line x1="15" y1="10" x2="105" y2="10" stroke="#68c6ff" stroke-width="4"/><circle cx="60" cy="28" r="6" ${c}/><path d="M55 34 48 49 34 62M55 34 69 48 84 62M50 38 35 13M67 38 84 13" ${c}/>` ,
bench:`<line x1="10" y1="62" x2="110" y2="62" stroke="#68c6ff" stroke-width="3"/><path d="M30 52 86 52M39 52 33 62M78 52 84 62" ${c}/><circle cx="57" cy="35" r="6" ${c}/><path d="M53 41 42 52M61 41 72 52M44 43 26 32M70 43 88 32M20 30 94 30" ${c}/>` ,
lat:`<line x1="10" y1="64" x2="110" y2="64" stroke="#68c6ff" stroke-width="3"/><circle cx="60" cy="12" r="6" ${c}/><path d="M60 18V43M60 28 35 17M60 28 85 17M60 43 46 64M60 43 74 64" ${c}/>` ,
dead:`<line x1="10" y1="64" x2="110" y2="64" stroke="#68c6ff" stroke-width="3"/><circle cx="70" cy="20" r="6" ${c}/><path d="M66 26 52 40 37 54M52 40 71 48 85 64M37 54 25 64M50 40 30 45M24 45H31V62" ${c}/>` ,
hip:`<line x1="10" y1="62" x2="110" y2="62" stroke="#68c6ff" stroke-width="3"/><circle cx="76" cy="35" r="6" ${c}/><path d="M70 40 53 49 35 56M53 49 70 62M35 56 22 62M53 49 48 62" ${c}/><line x1="48" y1="48" x2="91" y2="48" stroke="#238cff" stroke-width="4"/>`,
crunch:`<line x1="10" y1="62" x2="110" y2="62" stroke="#68c6ff" stroke-width="3"/><circle cx="70" cy="30" r="6" ${c}/><path d="M65 35 52 45 35 52 24 62M52 45 66 53 78 62M48 45 39 34M48 45 56 32" ${c}/>`};return `<svg viewBox="0 0 120 75">${body[t]||body.push}</svg>`}
function exCard(e){return `<div class="exercise"><div class="exTop"><div class="stick">${svg(e[3])}</div><div><h3>${esc(e[0])}</h3><div class="muted">${esc(e[1])}</div><p>${esc(e[2])}</p></div></div><div class="metrics"><div class="field"><label>Séries</label><input type="number" min="0" placeholder="0" oninput="saveW('${esc(e[0])}','sets',this.value)"></div><div class="field"><label>Répétitions</label><input type="number" min="0" placeholder="0" oninput="saveW('${esc(e[0])}','reps',this.value)"></div><div class="field"><label>Poids kg</label><input type="number" min="0" placeholder="0" oninput="saveW('${esc(e[0])}','weight',this.value)"></div></div><div class="muted" style="margin-top:5px">0 kg = poids du corps</div></div>`}
function saveW(n,k,v){let x=db.workouts.find(w=>w.date===db.selectedDate&&w.name===n);if(!x){x={date:db.selectedDate,name:n};db.workouts.push(x)}x[k]=v;save()}
function render(){document.getElementById('app').innerHTML=pages[page]()}
const pages={
home:()=>`${db.dayLogs[new Date().toISOString().slice(0,10)]?.validated?'':'<div class="notice">🔔 Pense à valider ta journée une fois tes informations du jour complétées.</div>'}<div class="card"><h1>Accueil</h1><div class="sub">Version téléphone : une seule colonne, tout se fait en défilant vers le bas.</div></div><div class="home">${[['🏋️','Sport','Musculation · sports · course & marche','sport'],['📋','Ma journée','Habitudes · oublis · sommeil · eau','day'],['🍽️','Alimentation','Journal simple de tes repas','food'],['🎯','Objectifs','Objectifs et suivi','goals'],['🗓️','Calendrier','Tous tes jours au même endroit','calendar'],['👤','Données personnelles','Informations modifiables','profile'],['📊','Bilan','Statistiques et activités','report'],['📅','Planning','Événements · révisions · pauses','plan'],['📝','Récapitulatif','Écrire et modifier ce que tu as fait','recap']].map(x=>`<button class="homeCard" onclick="go('${x[3]}')"><span class="homeIcon">${x[0]}</span><span><strong>${x[1]}</strong><small>${x[2]}</small></span></button>`).join('')}</div>`,
sport:()=>`${back()}<div class="card"><h1>Sport</h1><p>Les trois espaces sont séparés pour garder une navigation simple.</p><div class="tabs"><button class="tab ${sportTab==='muscu'?'active':''}" onclick="sportTab='muscu';render()">🏋️ Musculation</button><button class="tab ${sportTab==='sport'?'active':''}" onclick="sportTab='sport';render()">🏅 Sport</button><button class="tab ${sportTab==='run'?'active':''}" onclick="sportTab='run';render()">🏃 Course & marche</button></div></div>${sportTab==='muscu'?muscu():sportTab==='sport'?sportsView():runView()}`,
day:()=>{let d=dayData(db.selectedDate);return `${back()}<div class="card"><h1>Ma journée</h1><div class="sub">${new Date(db.selectedDate+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><div class="stats"><div class="stat"><b>${d.water||0}</b><span class="muted">verres d'eau</span></div><div class="stat"><b>${d.steps||0}</b><span class="muted">pas</span></div></div><div class="field"><label>Verres d'eau</label><input type="number" min="0" value="${d.water||0}" onchange="setDay('water',this.value);render()"></div><div class="row"><div class="field"><label>Coucher</label><input type="time" value="${d.sleepStart||''}" onchange="setDay('sleepStart',this.value);render()"></div><div class="field"><label>Réveil</label><input type="time" value="${d.sleepEnd||''}" onchange="setDay('sleepEnd',this.value);render()"></div></div><div class="stat"><b>${sleepLen(d.sleepStart,d.sleepEnd)}</b><span class="muted">durée de sommeil</span></div></div><div class="card"><div class="sectionHead"><h2>Mes 20 habitudes</h2><button class="btn light" onclick="manageChecks()">Gérer</button></div>${db.activeChecks.map(n=>{let v=d.checks[n];return `<div class="check"><span>🔹 ${esc(n)}</span><button class="mini yes ${v===true?'on':''}" onclick="setCheck('${esc(n)}',true)">Oui</button><button class="mini no ${v===false?'on':''}" onclick="setCheck('${esc(n)}',false)">Non</button></div>`}).join('')}<button class="btn" style="width:100%;margin-top:10px" onclick="validate()">✓ Valider ma journée</button>${d.validated?'<div class="notice">Journée validée. Tu peux encore la modifier.</div>':''}</div><div class="card"><h2>Oublis</h2><p>Un jour passé non validé reste signalé dans le calendrier. Tu peux le rouvrir et le compléter.</p></div>`},
food:()=>`${back()}<div class="card"><h1>Alimentation</h1><p>Journal simple des repas et quantités, sans objectif restrictif.</p><div class="field"><label>Aliment / repas</label><input id="foodName" placeholder="Ex. pâtes, sandwich…"></div><div class="row"><div class="field"><label>Quantité</label><input id="foodQty" placeholder="Ex. 150 g"></div><div class="field"><label>Moment</label><select id="foodMeal"><option>Petit-déjeuner</option><option>Déjeuner</option><option>Goûter</option><option>Dîner</option><option>Autre</option></select></div></div><button class="btn" onclick="addFood()">Ajouter</button></div><div class="card"><h2>Mes entrées</h2>${db.food.filter(x=>x.date===db.selectedDate).map(x=>`<div class="list">🍽️ <b>${esc(x.name)}</b><br><span class="muted">${esc(x.qty||'')} · ${esc(x.meal||'')}</span></div>`).join('')||'<span class="muted">Aucune entrée pour ce jour.</span>'}</div>`,
goals:()=>`${back()}<div class="card"><h1>Objectifs</h1><div class="field"><label>Objectif</label><input id="goalText" placeholder="Ex. faire 3 séances cette semaine"></div><div class="field"><label>Mesure</label><input id="goalMeasure" placeholder="Ex. nombre de séances"></div><div class="field"><label>Période</label><select id="goalPeriod"><option>Cette semaine</option><option>Ce mois</option><option>Cette année</option></select></div><button class="btn" onclick="addGoal()">Ajouter</button></div><div class="card">${db.goals.map((g,i)=>`<div class="list"><b>🎯 ${esc(g.text)}</b><br><span class="muted">${esc(g.measure)} · ${esc(g.period)}</span><div class="actions"><button class="mini" onclick="db.goals.splice(${i},1);save();render()">Supprimer</button></div></div>`).join('')||'<span class="muted">Aucun objectif.</span>'}</div>`,
calendar:()=>`${back()}<div class="card"><div class="sectionHead"><button class="icon" onclick="cursor.setMonth(cursor.getMonth()-1);render()">‹</button><h1>${cursor.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h1><button class="icon" onclick="cursor.setMonth(cursor.getMonth()+1);render()">›</button></div>${cal()}<div class="notice">Jour sélectionné : <b>${new Date(db.selectedDate+'T12:00:00').toLocaleDateString('fr-FR')}</b></div><button class="btn" onclick="go('day')">Modifier cette journée</button> <button class="btn light" onclick="go('recap')">Modifier le récapitulatif</button></div>`,
profile:()=>`${back()}<div class="card"><h1>Données personnelles</h1>${[['age','Âge'],['height','Taille'],['weight','Poids'],['note','Note']].map(x=>`<div class="field"><label>${x[1]}</label><input value="${esc(db.profile[x[0]]||'')}" onchange="db.profile['${x[0]}']=this.value;save()"></div>`).join('')}</div>`,
report:()=>`${back()}<div class="card"><h1>Bilan</h1><div class="stats"><div class="stat"><b>${db.activities.length}</b><span class="muted">séances sport</span></div><div class="stat"><b>${db.workouts.length}</b><span class="muted">exercices notés</span></div><div class="stat"><b>${db.food.length}</b><span class="muted">repas enregistrés</span></div><div class="stat"><b>${db.goals.length}</b><span class="muted">objectifs</span></div></div></div>`,
plan:()=>`${back()}<div class="card"><h1>Planning</h1><div class="field"><label>Nom</label><input id="eventName" placeholder="Ex. révision maths"></div><div class="row"><div class="field"><label>Date</label><input id="eventDate" type="date" value="${db.selectedDate}"></div><div class="field"><label>Heure</label><input id="eventTime" type="time"></div></div><div class="field"><label>Durée en minutes</label><input id="eventDur" type="number" min="1" max="1440" value="30"></div><button class="btn" onclick="addEvent()">Ajouter</button></div><div class="card"><h2>Événements</h2>${db.events.map((e,i)=>`<div class="list">📅 <b>${esc(e.name)}</b><br><span class="muted">${esc(e.date)} · ${esc(e.time||'')} · ${esc(e.dur||'')} min</span><button class="mini" style="float:right" onclick="db.events.splice(${i},1);save();render()">×</button></div>`).join('')||'<span class="muted">Aucun événement.</span>'}</div>`,
recap:()=>`${back()}<div class="card"><h1>Récapitulatif</h1><div class="sub">${new Date(db.selectedDate+'T12:00:00').toLocaleDateString('fr-FR')}</div><p>Tu peux le modifier quand tu veux depuis le calendrier.</p><textarea id="recapText" placeholder="Aujourd'hui, j'ai…">${esc(db.recaps[db.selectedDate]||'')}</textarea><button class="btn" style="margin-top:10px" onclick="db.recaps[db.selectedDate]=document.getElementById('recapText').value;save();render()">Enregistrer</button></div>`};
function muscu(){return `<div class="card"><h2>Exercices</h2><input placeholder="Rechercher un exercice…" oninput="filterEx(this.value)"><div id="exlist">${EX.map(exCard).join('')}</div></div>`}
function filterEx(q){let a=EX.filter(e=>(e[0]+' '+e[1]).toLowerCase().includes(q.toLowerCase()));document.getElementById('exlist').innerHTML=a.map(exCard).join('')||'<span class="muted">Aucun exercice trouvé.</span>'}
function sportsView(){return `<div class="card"><h2>Ajouter une séance</h2><div class="field"><label>Sport</label><input id="sportName" list="sports" placeholder="Football, tennis…"><datalist id="sports">${SPORTS.map(s=>`<option value="${s[0]}">`).join('')}</datalist></div><div class="field"><label>Durée</label><input id="sportDur" placeholder="1 h 15"></div><div class="field"><label>Statistiques</label><input id="sportStats" placeholder="Ex. 2 buts, score 3-1"></div><button class="btn" onclick="addActivity()">Ajouter</button></div><div class="card"><h2>Suggestions</h2>${SPORTS.map(s=>`<div class="sportItem"><h3>${s[1]} ${esc(s[0])}</h3><div class="muted">${esc(s[2])}</div></div>`).join('')}</div>`}
function runView(){return `<div class="card"><h2>Course & marche</h2><div class="row"><div class="field"><label>Distance km</label><input id="rd" type="number" step=".01" oninput="calcP()"></div><div class="field"><label>Temps</label><input id="rt" placeholder="45:00" oninput="calcP()"></div></div><div class="stat"><b id="pace">—</b><span class="muted">allure / km</span></div><div class="field"><label>Pas</label><input id="rs" type="number"></div><button class="btn" onclick="db.activities.push({date:db.selectedDate,name:'Course & marche',distance:rd.value,time:rt.value,steps:rs.value});save();render()">Enregistrer</button></div>`}
function calcP(){let d=+rd.value,t=rt.value.split(':').map(Number);if(!d||!t.length){pace.textContent='—';return}let min=t.length===2?t[0]+t[1]/60:t[0]*60+t[1]+t[2]/60;let p=min/d;pace.textContent=Math.floor(p)+':'+String(Math.round((p%1)*60)).padStart(2,'0')}
function cal(){let y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),start=(first.getDay()+6)%7,s='';for(let i=0;i<start;i++)s+='<button class="day empty"></button>';for(let n=1;n<=last.getDate();n++){let d=new Date(y,m,n),iso=d.toISOString().slice(0,10),cls=iso===db.selectedDate?'sel ':''+(iso===new Date().toISOString().slice(0,10)?'today':'');let done=db.dayLogs[iso]?.validated||db.recaps[iso];s+=`<button class="day ${cls}" onclick="db.selectedDate='${iso}';save();render()">${n}${done?'<span class="dot"></span>':''}</button>`}return `<div class="calendar">${['L','M','M','J','V','S','D'].map(x=>`<div class="dow">${x}</div>`).join('')}${s}</div>`}
function manageChecks(){document.getElementById('app').innerHTML=`${back()}<div class="card"><h1>Organiser mes habitudes</h1><p>Supprime, ajoute ou déplace. Tu peux mettre les habitudes du matin en haut et celles du soir en bas.</p>${db.activeChecks.map((n,i)=>`<div class="list"><b>${i+1}. ${esc(n)}</b><div class="actions"><button class="mini" onclick="moveCheck(${i},-1)">↑</button><button class="mini" onclick="moveCheck(${i},1)">↓</button><button class="mini" onclick="db.activeChecks.splice(${i},1);save();manageChecks()">Supprimer</button></div></div>`).join('')}<hr><h2>Ajouter parmi 100 suggestions</h2><input id="sx" placeholder="Rechercher…" oninput="showSuggestions(this.value)"><div id="suggestions"></div><hr><h2>Créer la tienne</h2><div class="row"><input id="custom" placeholder="Ma propre habitude"><button class="btn" onclick="addCheck(document.getElementById('custom').value)">Ajouter</button></div></div>`;showSuggestions('')}
function showSuggestions(q){let a=EXTRA.filter(x=>x.toLowerCase().includes(q.toLowerCase())).slice(0,100);let e=document.getElementById('suggestions');if(e)e.innerHTML=a.map(x=>`<div class="list">＋ ${esc(x)} <button class="mini" style="float:right" onclick="addCheck('${esc(x)}')">Ajouter</button></div>`).join('')}
function addCheck(n){n=n.trim();if(!n)return;if(!db.activeChecks.includes(n))db.activeChecks.push(n);save();manageChecks()}
function moveCheck(i,d){let j=i+d;if(j<0||j>=db.activeChecks.length)return;[db.activeChecks[i],db.activeChecks[j]]=[db.activeChecks[j],db.activeChecks[i]];save();manageChecks()}
function addFood(){let n=foodName.value.trim();if(!n)return;db.food.push({date:db.selectedDate,name:n,qty:foodQty.value,meal:foodMeal.value});save();render()}
function addGoal(){let t=goalText.value.trim();if(!t)return;db.goals.push({text:t,measure:goalMeasure.value,period:goalPeriod.value});save();render()}
function addActivity(){let n=sportName.value.trim();if(!n)return;db.activities.push({date:db.selectedDate,name:n,duration:sportDur.value,stats:sportStats.value});save();render()}
function addEvent(){let n=eventName.value.trim();if(!n)return;db.events.push({name:n,date:eventDate.value,time:eventTime.value,dur:eventDur.value});save();render()}
render();
</script></body></html>
