<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f7fbff">
<title>Routinee</title>
<style>
:root{
  --blue:#168cff;--cyan:#21c8ee;--violet:#7b61ff;--green:#25b77a;--orange:#ff9f43;
  --pink:#ff6f9c;--ink:#17324a;--muted:#607486;--line:#d8e8f4;
  --card:rgba(255,255,255,.95);--shadow:0 10px 28px rgba(30,95,135,.13)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}
body{
 background:
 linear-gradient(rgba(255,255,255,.82),rgba(247,251,255,.91)),
 url('background.svg') center/cover fixed no-repeat;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.shell{width:min(760px,100%);margin:auto;padding:12px 10px 35px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 3px 12px}
.brand{font-size:26px;font-weight:950}
.sub,.muted{color:var(--muted);font-size:14px}
.icon,.back,.btn{border-radius:15px;padding:11px 14px;font-weight:850}
.icon,.back{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn{border:0;background:linear-gradient(135deg,var(--blue),#62c8ff);color:#fff;box-shadow:0 7px 18px #238cff2d}
.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
h1{font-size:31px;line-height:1.1;margin:0 0 5px}
h2{font-size:23px;margin:0 0 8px}
h3{font-size:18px;margin:0 0 4px}
p{font-size:16px;line-height:1.45}
.card{background:var(--card);border:1px solid #fff;border-radius:23px;padding:17px;margin:11px 0;box-shadow:var(--shadow);backdrop-filter:blur(9px)}
.home{display:flex;flex-direction:column;gap:12px}
.homeCard{
 width:100%;min-height:116px;display:flex;align-items:center;text-align:left;gap:15px;padding:16px;
 border:1px solid #fff;border-radius:24px;background:#fff;box-shadow:var(--shadow);color:var(--ink)
}
.homeCard:active{transform:scale(.985)}
.homeIcon{width:59px;height:59px;flex:none;border-radius:19px;display:grid;place-items:center;font-size:31px;border:1px solid}
.homeCard strong{display:block;font-size:21px}
.homeCard small{display:block;color:var(--muted);font-size:14px;margin-top:3px}
.c-blue .homeIcon{background:#e8f4ff;border-color:#b9ddff}.c-green .homeIcon{background:#e9fbf2;border-color:#bfead3}
.c-orange .homeIcon{background:#fff3e5;border-color:#ffd5a5}.c-violet .homeIcon{background:#f0edff;border-color:#d5ceff}
.c-pink .homeIcon{background:#fff0f5;border-color:#ffd0df}.c-cyan .homeIcon{background:#e8fbff;border-color:#bcecf5}
.c-yellow .homeIcon{background:#fff9df;border-color:#f3df8e}.c-purple .homeIcon{background:#f2efff;border-color:#d9d0ff}
.c-red .homeIcon{background:#fff0f0;border-color:#ffd0d0}
.notice{background:#fff9df;border:1px solid #efd68a;border-radius:16px;padding:13px;margin:10px 0}
.notice.red{background:#fff1f1;border-color:#ffc7c7}
.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.field{margin:9px 0}.field label{display:block;font-size:14px;font-weight:850;margin-bottom:5px}
input,select,textarea{width:100%;padding:12px 12px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);outline:none}
textarea{min-height:130px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px;margin:10px 0;box-shadow:var(--shadow)}
.datebar .datecenter{text-align:center;flex:1}.datecenter b{display:block;font-size:17px}.datecenter span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tab{flex:1;min-width:0;padding:12px;text-align:center;border:1px solid var(--line);border-radius:16px;background:#fff;font-weight:850;color:var(--ink)}
.tab.active{border-color:#69baff;background:#eaf7ff;color:#0d72d2}
.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.exercise,.sportItem,.list{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin:9px 0}
.exTop{display:flex;gap:11px;align-items:center}
.stick{width:100px;height:73px;flex:none;display:grid;place-items:center;background:#eef9ff;border:1px solid #c8eaff;border-radius:14px}
.stick svg{width:94px;height:64px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.metrics .field{margin:8px 0 0}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick button{text-align:left;padding:12px;border-radius:15px;border:1px solid #bfe0f7;background:#f5fbff;font-weight:850}
.check{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px 11px;margin:7px 0}
.mini{padding:8px 9px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800}
.yes.on{background:#dff9e9;color:#167747}.no.on{background:#ffe7e7;color:#b52f2f}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px}.stat b{display:block;font-size:25px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.dow{text-align:center;font-size:12px;font-weight:900;color:var(--muted);padding:4px}
.day{min-height:44px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:800;position:relative}
.day.empty{visibility:hidden}.day.today{outline:2px solid #66b8ff}.day.sel{background:#e5f5ff;border-color:#5db1ff}
.dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#23b66d;bottom:5px;left:50%;transform:translateX(-50%)}
.actions{display:flex;gap:5px;flex-wrap:wrap}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
@media(max-width:520px){
 .shell{padding:10px 9px 28px}h1{font-size:29px}.homeCard{min-height:112px}
 .homeIcon{width:55px;height:55px}.metrics{grid-template-columns:1fr 1fr}.exTop{align-items:flex-start}.stick{width:91px}
 .tabs{display:grid;grid-template-columns:1fr 1fr 1fr}.tab{font-size:13px}
}

/* Routine V7 preview */
body{padding-bottom:95px}body[data-theme="dark"]{--ink:#edf4ff;--muted:#b5c5da;--line:#35475d;--card:rgba(24,34,52,.96);--shadow:0 10px 28px #0005;background:linear-gradient(#0b1524ed,#0b1524f5),url('background.svg') center/cover fixed no-repeat;color-scheme:dark}
body[data-theme="dark"] .homeCard,body[data-theme="dark"] .icon,body[data-theme="dark"] .back,body[data-theme="dark"] .btn.light,body[data-theme="dark"] .datebar,body[data-theme="dark"] .tab,body[data-theme="dark"] .exercise,body[data-theme="dark"] .sportItem,body[data-theme="dark"] .list,body[data-theme="dark"] .check,body[data-theme="dark"] .stat,body[data-theme="dark"] .mini,body[data-theme="dark"] input,body[data-theme="dark"] select,body[data-theme="dark"] textarea{background:#1b2a3d;color:var(--ink);border-color:var(--line)}
body[data-theme="dark"] .card{border-color:#34465d}body[data-theme="dark"] .quick button{background:#203650;color:var(--ink)}body[data-theme="dark"] .notice{background:#423c24;color:#fff0c6}body[data-theme="dark"] .notice.red{background:#492c35;color:#ffe2e2}
body[data-theme="dark"] .homeIcon{background:#273d55;border-color:#486580}body[data-theme="dark"] .tab.active{background:#173f63;color:#b9e2ff}
.v7hero{padding:22px;border-radius:25px;background:linear-gradient(120deg,var(--accent,#168cff),#6e68e9);color:white;box-shadow:var(--shadow);margin:12px 0}.v7hero h1{color:white}.v7hero p{color:#f4f7ff;margin:8px 0}.v7grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.v7tile{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:13px}.v7tile strong{display:block;font-size:24px}.v7tile span{color:var(--muted);font-size:13px}.v7bar{height:11px;background:#cbd9e6;border-radius:12px;overflow:hidden;margin:10px 0}.v7bar>i{display:block;height:100%;background:var(--accent,#168cff);border-radius:12px}.v7bottom{position:fixed;bottom:0;left:0;right:0;padding:12px max(12px,calc((100vw - 760px)/2));background:var(--card);border-top:1px solid var(--line);backdrop-filter:blur(18px);z-index:40;display:flex;gap:8px;box-shadow:0 -8px 30px #0002}.v7bottom input{flex:1;min-width:0}.v7bottom button{flex:0 0 auto}.v7results{position:fixed;bottom:76px;left:max(12px,calc((100vw - 760px)/2));right:max(12px,calc((100vw - 760px)/2));max-height:50vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 35px #0004;z-index:41;padding:8px}.v7results button{display:block;width:100%;padding:12px;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink)}.v7resultHidden{display:none}.v7pill{display:inline-block;padding:7px 10px;border-radius:20px;background:var(--card);border:1px solid var(--line);margin:3px}.v7study{border-left:4px solid var(--accent,#168cff)}.v7muted{color:var(--muted)}

/* V8 : modules additionnels, compatibles avec la V7 */
body[data-custom-bg="yes"]{background-image:linear-gradient(rgba(255,255,255,.77),rgba(247,251,255,.86)),var(--user-bg)!important;background-position:center!important;background-size:cover!important;background-attachment:fixed!important}
body[data-theme="dark"][data-custom-bg="yes"]{background-image:linear-gradient(rgba(7,13,25,.86),rgba(7,13,25,.93)),var(--user-bg)!important}
.v8action{display:flex;gap:8px;flex-wrap:wrap}.v8action button{flex:1;min-width:110px}
.v8badge{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(130deg,#e8d5ff,#d9f2ff);color:#25365c;border-radius:18px;padding:12px;margin:5px;font-weight:850;box-shadow:0 5px 18px #0001;animation:v8float 3s ease-in-out infinite}
.v8badge.lock{filter:grayscale(1);opacity:.55}.v8trophy{font-size:56px;display:inline-block;animation:v8float 3s ease-in-out infinite}
@keyframes v8float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes v8pop{0%{transform:scale(.85);opacity:.5}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.v8reward{animation:v8pop .5s ease-out}.v8photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.v8photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.v8fab{border-radius:14px!important;padding:10px 13px!important;font-size:21px!important}.v8timer{font-size:52px;font-weight:950;text-align:center;margin:24px 0;font-variant-numeric:tabular-nums}
.v8week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.v8week button{padding:9px 2px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12px;min-width:0}
.v8reorder{width:100%;margin-top:16px;padding:15px;border:2px dashed var(--line);border-radius:18px;background:var(--card);color:var(--ink);font-weight:850}
.v8toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:90;background:#223b58;color:white;padding:13px 20px;border-radius:20px;box-shadow:0 12px 30px #0004}

/* V8.1 : accueil simplifié, navigation et mouvements discrets */
.v81welcome{padding:22px 19px;border-radius:25px;background:linear-gradient(130deg,var(--accent,#168cff),#7467d9);color:#fff;box-shadow:var(--shadow);margin:10px 0 14px}
.v81welcome h1{font-size:29px;color:white;margin:7px 0}.v81welcome p,.v81welcome small{color:#f0f5ff;margin:0}
.v81summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.v81summary button{min-width:0;text-align:left;padding:12px 9px;background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--ink)}.v81summary b{font-size:23px;display:block}.v81summary span{font-size:12px;color:var(--muted)}
.v81shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}.v81shortcuts button{padding:16px 11px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);text-align:left;font-weight:850;font-size:15px;min-width:0}.v81shortcuts span{font-size:23px;display:block;margin-bottom:5px}
.v81section{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 2px 8px}.v81section h2{font-size:19px;margin:0}.v81section button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:13px;font-weight:800}
.v81compact .homeCard{min-height:72px;padding:10px 13px;border-radius:17px;margin:0}.v81compact{gap:7px}.v81compact .homeIcon{width:44px;height:44px;font-size:24px;border-radius:13px}.v81compact .homeCard strong{font-size:16px}.v81compact .homeCard small{font-size:12px}
.v81hidden{display:none}.v81footer{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.v81footer button{flex:1;padding:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:15px;font-weight:800}
.v7bottom{padding-bottom:max(12px,env(safe-area-inset-bottom))}.v7bottom input{border-radius:17px}
@media(prefers-reduced-motion:no-preference){.homeCard,.v81shortcuts button,.v81summary button,.v81footer button,.btn,.mini,.tab{transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease}.homeCard:active,.v81shortcuts button:active,.v81summary button:active,.btn:active{transform:scale(.975)}#app{animation:v81enter .22s ease-out}@keyframes v81enter{from{opacity:.45;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}}
@media(max-width:370px){.v81summary span{font-size:11px}.v81shortcuts button{font-size:13px}}

/* V8.2 : interface futuriste légère, lumineuse et accessible */
:root{--glow:rgba(49,162,255,.26)}
body{background-attachment:fixed}
.shell{position:relative}
.top{border-radius:0 0 22px 22px;backdrop-filter:blur(20px)}
.v81welcome{position:relative;overflow:hidden;background:linear-gradient(122deg,#102d5c 0%,var(--accent,#168cff) 55%,#765aff 100%);border:1px solid #ffffff55;box-shadow:0 14px 35px var(--glow)}
.v81welcome:after{content:'';position:absolute;width:170px;height:170px;right:-55px;top:-85px;border-radius:50%;border:25px solid #ffffff22;pointer-events:none}
.v81welcome:before{content:'✦';position:absolute;right:28px;bottom:18px;font-size:46px;color:#ffffff2e;pointer-events:none}
.v81shortcuts button,.v81summary button{position:relative;overflow:hidden;box-shadow:0 5px 20px #15376a10}
.v81shortcuts button:focus-visible,.v81summary button:focus-visible,.v82float:focus-visible{outline:3px solid var(--accent,#168cff);outline-offset:3px}
.v81shortcuts button span{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#e4f4ff,#e9e4ff);margin-bottom:10px}
.v82float{border:1px solid #ffffff88!important;background:linear-gradient(140deg,var(--accent,#168cff),#735aff)!important;color:white!important;box-shadow:0 7px 25px var(--glow),inset 0 1px 0 #ffffff80!important;cursor:pointer}
.v82download{width:43px;height:43px;display:inline-grid;place-items:center;font-size:23px;line-height:1}
.v82download svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.v82fab{width:53px;height:53px;border-radius:18px!important;font-size:30px!important;display:grid;place-items:center}
.v7bottom{background:color-mix(in srgb,var(--card) 88%,transparent);border-radius:20px 20px 0 0;padding-top:9px;padding-bottom:max(10px,env(safe-area-inset-bottom));box-shadow:0 -6px 28px #12335a1e}
.v7bottom input{background:var(--card);border-radius:18px;min-height:50px}
.v82tag{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:100px;background:#ffffff22;border:1px solid #ffffff44;font-size:12px;font-weight:700}
.v82sheetWrap{position:fixed;inset:0;z-index:100;background:#08142e88;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px)}
.v82sheet{width:min(100%,650px);max-height:90dvh;overflow:auto;padding:20px 20px max(24px,env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:var(--card);color:var(--ink);box-shadow:0 -20px 70px #0005;animation:v82rise .24s ease-out}
.v82sheetHead{display:flex;align-items:center;justify-content:space-between;gap:12px}.v82sheetHead h2{margin:4px 0 16px}
.v82choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:0 0 15px}.v82choices button{padding:13px 8px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:800}.v82choices button[aria-pressed=true]{background:var(--accent,#168cff);color:white;border-color:transparent}
.v82sheet label{display:block;font-weight:750;margin:12px 0 6px}.v82sheet input,.v82sheet select{width:100%;box-sizing:border-box}
.v82save{width:100%;margin-top:17px;min-height:48px}
.v82widgetOff{display:none!important}.v82settingsChoice{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.v82settingsChoice input{width:22px;height:22px;accent-color:var(--accent,#168cff)}
.v82tiny{font-size:12px;color:var(--muted)}
@keyframes v82rise{from{transform:translateY(50px);opacity:.5}to{transform:translateY(0);opacity:1}}
@media(prefers-reduced-motion:no-preference){.v82float{transition:transform .2s ease,filter .2s ease,box-shadow .2s ease}.v82float:active{transform:scale(.92)}.v81shortcuts button:hover{transform:translateY(-3px);box-shadow:0 10px 26px var(--glow)}.v81welcome:before{animation:v82spark 5s ease-in-out infinite}@keyframes v82spark{50%{transform:rotate(20deg) scale(1.14);opacity:.7}}}
@media(prefers-reduced-motion:reduce){.v8badge,.v8trophy,.v8reward,#app,.v82sheet{animation:none!important;transition:none!important}}
</style>

<body>
<main class="shell">
<header class="top">
 <div><div class="brand">Routine ✦</div><div class="sub">Sport · organisation · études</div></div>
 <div style="display:flex;gap:7px"><button class="icon" id="v7theme" onclick="v7ToggleTheme()" aria-label="Changer de thème">🌙</button><button class="icon v82download" onclick="v8Export()" aria-label="Télécharger mes données" title="Télécharger mes données"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3"/></svg></button></div>
</header>
<div id="app"></div><div id="v82sheetRoot"></div><div id="v8toast" class="v8toast" style="display:none"></div>

let page='home',sportTab='muscu',cursor=new Date();cursor.setDate(1);

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const save=()=>localStorage.setItem('routineDB',JSON.stringify(db));
const go=p=>{page=p;render()};

const selectedDateLabel=()=>new Date(db.selectedDate+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
function changeDate(delta){
 const d=new Date(db.selectedDate+'T12:00:00');d.setDate(d.getDate()+delta);db.selectedDate=d.toISOString().slice(0,10);save();render();
}
function datebar(){return `<div class="datebar"><button class="icon" onclick="changeDate(-1)">‹</button><div class="datecenter"><b>${esc(selectedDateLabel())}</b><span>Journée sélectionnée</span></div><button class="icon" onclick="changeDate(1)">›</button></div>`}
function dayData(d){return db.dayLogs[d]||{checks:{},water:'',steps:'',sleepStart:'',sleepEnd:'',validated:false}}
function setDay(k,v){let d=dayData(db.selectedDate);d[k]=v;db.dayLogs[db.selectedDate]=d;save()}
function setCheck(n,v){let d=dayData(db.selectedDate);d.checks[n]=v;db.dayLogs[db.selectedDate]=d;save();render()}
function validate(){setDay('validated',true);render()}
function sleepLen(a,b){if(!a||!b)return '—';let [h,m]=a.split(':').map(Number),[H,M]=b.split(':').map(Number),x=h*60+m,y=H*60+M;if(y<=x)y+=1440;let z=y-x;return Math.floor(z/60)+' h '+String(z%60).padStart(2,'0')}

 let e={id:Date.now(),name:n,date:document.getElementById('eventDate').value,time:document.getElementById('eventTime').value,dur:document.getElementById('eventDur').value,repeat:document.getElementById('eventRepeat').value,end:document.getElementById('eventEnd').value,pauses:[]};
 let ps=document.getElementById('pauseStart').value,pe=document.getElementById('pauseEnd').value;if(ps&&pe)e.pauses.push({start:ps,end:pe});
 db.events.push(e);save();render()
}
function eventOccurs(e,iso){
 if(!e||!e.date)return false;
 let d=new Date(iso+'T12:00:00'), start=new Date(e.date+'T12:00:00');
 if(d<start)return false;
 if(e.end && iso>e.end)return false;
 if((e.pauses||[]).some(p=>iso>=p.start&&iso<=p.end))return false;
 let r=e.repeat||'none';
 if(r==='none')return iso===e.date;
 if(r==='daily')return true;
 if(r==='weekly')return d.getDay()===start.getDay();
 if(r==='monthly')return d.getDate()===start.getDate();
 return false;
}
function eventsForDate(iso){return db.events.filter(e=>eventOccurs(e,iso))}
function addEventPause(id){let e=db.events.find(x=>x.id===id);if(!e)return;let a=prompt('Début de la pause (AAAA-MM-JJ) :','');if(!a)return;let b=prompt('Fin de la pause (AAAA-MM-JJ) :',a);if(!b)return;(e.pauses||(e.pauses=[])).push({start:a,end:b});save();render()}

function cal(){
 let y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),start=(first.getDay()+6)%7,s='';
 for(let i=0;i<start;i++)s+='<button class="day empty"></button>';
 for(let n=1;n<=last.getDate();n++){
  let d=new Date(y,m,n),iso=d.toISOString().slice(0,10),cls=(iso===db.selectedDate?'sel ':'')+(iso===todayISO()?'today':'');
  let done=db.dayLogs[iso]?.validated||db.recaps[iso]||db.oublis.some(o=>o.date===iso);
  s+=`<button class="day ${cls}" onclick="db.selectedDate='${iso}';save();render()">${n}${done?'<span class="dot"></span>':''}</button>`;
 }
 return `<div class="calendar">${['L','M','M','J','V','S','D'].map(x=>`<div class="dow">${x}</div>`).join('')}${s}</div>`;
}

function autoRecap(){
 const d=dayData(db.selectedDate);
 const checks=Object.entries(d.checks||{}).filter(([,v])=>v===true).map(([k])=>k);
 const no=Object.entries(d.checks||{}).filter(([,v])=>v===false).map(([k])=>k);
 const ws=db.workouts.filter(x=>x.date===db.selectedDate&&x.done);
 const acts=db.activities.filter(x=>x.date===db.selectedDate);
 const foods=db.food.filter(x=>x.date===db.selectedDate);
 const evs=eventsForDate(db.selectedDate);
 const lines=[];
 lines.push('Journée du '+new Date(db.selectedDate+'T12:00:00').toLocaleDateString('fr-FR')+'.');
 if(checks.length) lines.push('Habitudes faites : '+checks.join(', ')+'.');
 if(no.length) lines.push('Habitudes non faites : '+no.join(', ')+'.');
 if(ws.length) lines.push('Musculation : '+ws.map(x=>x.name+' ('+(x.sets||0)+' séries, '+(x.reps||0)+' reps, '+(x.weight??0)+' kg)').join(', ')+'.');
 if(acts.length) lines.push('Sports : '+acts.map(x=>x.name+(x.duration?' · '+x.duration:'')+(x.stats?' · '+x.stats:'')).join(', ')+'.');
 if(foods.length) lines.push('Alimentation enregistrée : '+foods.map(x=>x.name+(x.qty?' · '+x.qty:'')).join(', ')+'.');
 if(evs.length) lines.push('Planning : '+evs.map(x=>x.name).join(', ')+'.');
 if(d.water) lines.push('Eau : '+d.water+' verre(s).');
 if(d.steps) lines.push('Pas : '+d.steps+'.');
 if(d.sleepStart&&d.sleepEnd) lines.push('Sommeil : '+sleepLen(d.sleepStart,d.sleepEnd)+'.');
 if(!checks.length&&!ws.length&&!acts.length&&!foods.length&&!evs.length) lines.push('Aucune donnée enregistrée pour cette journée.');
 return lines.join('\n');
}

}

let v8Clock=null,v8Remaining=1500;

function v8Export(){let bundle={routineDB:db,routineV7:v7,routineV8:{...v8,background:undefined},routineTheme:localStorage.getItem('routineTheme')};let blob=new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='routinee-sauvegarde-'+todayISO()+'.json';a.click();URL.revokeObjectURL(a.href)}
function v8Import(input){let f=input.files?.[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!x.routineDB||!x.routineV7)return alert('Fichier de sauvegarde Routinee invalide.');if(!confirm('Remplacer les données actuelles par cette sauvegarde ? Exporte tes données actuelles avant.'))return;localStorage.setItem('routineDB',JSON.stringify(x.routineDB));localStorage.setItem('routineV7',JSON.stringify(x.routineV7));localStorage.setItem('routineV8',JSON.stringify(x.routineV8||{}));if(x.routineTheme)localStorage.setItem('routineTheme',x.routineTheme);location.reload()}catch(e){alert('Impossible de lire ce fichier.')}};rd.readAsText(f)}
views.backup=()=>`${back()}<div class="card"><h1>💾 Sauvegarde et restauration</h1><p>Exporte tes données avant de changer d'appareil ou de navigateur.</p><button class="btn" onclick="v8Export()">⇩ Télécharger une sauvegarde</button><div class="field"><label>Restaurer un fichier JSON</label><input type="file" accept="application/json,.json" onchange="v8Import(this)"></div><p class="muted">Les données restent locales. Une sauvegarde ne synchronise pas automatiquement tes appareils.</p></div>`;
function v8Background(input){let file=input.files?.[0];if(!file)return;let rd=new FileReader();rd.onload=()=>{let img=new Image();img.onload=()=>{let cv=document.createElement('canvas'),k=Math.min(1,1500/Math.max(img.width,img.height));cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);let data=cv.toDataURL('image/jpeg',.7);try{localStorage.setItem('routineBackground',data);v8ApplyBackground();v8toast('Fond enregistré !')}catch(e){alert('Image trop volumineuse pour le navigateur.')}};img.src=rd.result};rd.readAsDataURL(file)}

function v7Search(query){let panel=document.getElementById('v7results');if(!panel)return;let q=query.trim().toLocaleLowerCase('fr');if(!q){panel.classList.add('v7resultHidden');return}let normalize=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let term=normalize(q),results=[];const add=(label,page,action='')=>{if(normalize(label).includes(term))results.push({label,page,action})};
 v7categories.forEach(x=>add(x[1]+' '+x[2]+' '+x[3],x[0]));
 [...SPORTS].forEach(x=>add(x[1]+' '+x[0]+' — Sport','sport',x[0]));
 (typeof allExercises==='function'?allExercises():EX).forEach(x=>add('🏋️ '+x[0]+' — Musculation','sport',x[0]));
 [...DEFAULT,...EXTRA,...db.activeChecks].forEach(x=>add('☑️ '+x+' — Habitude','day'));
 v7.study.forEach(x=>add('📚 '+x.subject+' : '+x.name,'study'));
 (db.events||[]).forEach(x=>add('📅 '+x.name,'plan'));
 v8.events.forEach(x=>add('📅 '+x.name,'week'));
 let seen=new Set();results=results.filter(x=>{let k=x.label;if(seen.has(k))return false;seen.add(k);return true}).slice(0,25);
 panel.innerHTML=results.length?results.map((x,i)=>`<button onclick="v8OpenSearch(${i})">${v8esc(x.label)} →</button>`).join(''):'<p class="muted" style="padding:10px">Aucun résultat trouvé.</p>';
 window.v8LastResults=results;panel.classList.remove('v7resultHidden')}

let v82kind='note';
const v82kinds=[['note','📝 Note'],['study','📚 Devoir'],['event','🗓️ Événement'],['sport','🏃 Activité'],['forget','🔔 Oubli']];
function v82Quick(kind='note'){
 v82kind=kind;const root=document.getElementById('v82sheetRoot');
 root.innerHTML=`<div class="v82sheetWrap" onclick="if(event.target===this)v82Close()"><section class="v82sheet" role="dialog" aria-modal="true" aria-labelledby="v82title"><div class="v82sheetHead"><h2 id="v82title">✦ Ajout rapide</h2><button class="mini" onclick="v82Close()" aria-label="Fermer">✕</button></div><p class="v82tiny">Une action, quelques secondes, et c'est enregistré.</p><div class="v82choices">${v82kinds.map(([id,label])=>`<button type="button" aria-pressed="${id===kind}" onclick="v82Select('${id}')">${label}</button>`).join('')}</div><form onsubmit="v82Submit(event)"><label for="v82name">Qu'est-ce que tu veux ajouter ?</label><input id="v82name" maxlength="180" required placeholder="Ex. Réviser les maths" autocomplete="off"><div id="v82extra"></div><button class="btn v82float v82save" type="submit">✦ Enregistrer</button></form></section></div>`;
 v82Select(kind);document.getElementById('v82name').focus();
}
function v82Select(kind){v82kind=kind;document.querySelectorAll('.v82choices button').forEach((b,i)=>b.setAttribute('aria-pressed',String(v82kinds[i][0]===kind)));
 const el=document.getElementById('v82extra');if(!el)return;
 el.innerHTML=kind==='study'?'<label for="v82subject">Matière</label><input id="v82subject" placeholder="Ex. Maths"><label for="v82date">À faire pour le</label><input id="v82date" type="date">':kind==='event'?'<label for="v82date">Date de l’événement</label><input id="v82date" type="date">':kind==='sport'?'<label for="v82duration">Durée (facultatif, en minutes)</label><input id="v82duration" type="number" min="0" max="1440" placeholder="Ex. 30">':'';

}
function v82Close(){document.getElementById('v82sheetRoot').innerHTML=''}
function v82Submit(event){event.preventDefault();const name=document.getElementById('v82name').value.trim();if(!name)return;
 const date=document.getElementById('v82date')?.value||db.selectedDate||todayISO();let destination='home';
 if(v82kind==='note'){v8.notes.push({id:Date.now(),date,text:name});v8save();destination='journal'}
 if(v82kind==='study'){v7.study.push({id:Date.now(),name,subject:document.getElementById('v82subject')?.value.trim()||'Autre',date,done:false});v7save();destination='study'}
 if(v82kind==='event'){v8.events.push({id:Date.now(),name,date});v8save();destination='week'}

 if(v82kind==='forget'){db.oublis.push({id:Date.now(),date,text:name,done:false});save();destination='day'}
